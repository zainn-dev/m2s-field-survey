services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: m2s, POSTGRES_PASSWORD: CHANGE_ME, POSTGRES_DB: m2s }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: CHANGE_ME, MINIO_ROOT_PASSWORD: CHANGE_ME_LONG }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes: { pgdata: {}, miniodata: {} }
