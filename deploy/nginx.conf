upstream m2s_app {
  server app:3000;
  keepalive 32;
}

# HTTP listener: forwards traffic cleanly or upgrades to HTTPS once TLS certs are mounted.
server {
  listen 80;
  server_name _;

  # Keep higher than API upload limits (10 pages x 10 MB + multipart overhead).
  client_max_body_size 110m;

  # Uncomment to force HTTPS redirect once TLS certificates are placed in /etc/nginx/certs:
  # return 301 https://$host$request_uri;

  location / {
    proxy_pass http://m2s_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Required so streaming exports (/api/v1/exports/documents.zip) flush incrementally.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

